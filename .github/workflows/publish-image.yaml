name: Publish Docker image

# Build the Milvus image and push it to GitHub Container Registry when a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          # Leave a small reserve on /. The rest of the disk is mounted on the
          # workspace. Docker must not keep image layers on /.
          root-reserve-mb: 8192
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Docker data onto the build volume
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          docker_root="${GITHUB_WORKSPACE}/.docker-data"
          sudo mkdir -p "${docker_root}"
          tmp="$(mktemp)"
          if [ -f /etc/docker/daemon.json ]; then
            jq --arg root "${docker_root}" '. + {"data-root": $root}' /etc/docker/daemon.json > "${tmp}"
          else
            jq -n --arg root "${docker_root}" '{"data-root": $root}' > "${tmp}"
          fi
          sudo mv "${tmp}" /etc/docker/daemon.json
          sudo systemctl start docker
          docker info -f 'DockerRootDir={{.DockerRootDir}}'
          df -h

      - name: Image coordinates
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "MILVUS_IMAGE_REPO=ghcr.io/${owner}/milvus" >> "$GITHUB_ENV"
          echo "MILVUS_IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Milvus
        run: ./build/builder.sh make install

      - name: Build image
        run: ./build/build_image.sh

      - name: Push image
        run: docker push "${MILVUS_IMAGE_REPO}:${MILVUS_IMAGE_TAG}"
